# Baut bei jedem Hochladen automatisch eine neue Windows-Version
# und veröffentlicht sie unter "Releases". Die installierten Apps holen sie sich von dort.
name: Windows-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Versionsnummer automatisch hochzählen
        shell: bash
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Pakete installieren
        run: npm install

      - name: App bauen
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Web-Version für Netlify: Inhalt von app/ als ZIP (index.html liegt direkt oben im ZIP).
      # 7z statt Compress-Archive, damit die Pfade im ZIP Schrägstriche haben (sonst Probleme auf Linux-Servern).
      - name: Web-ZIP für Netlify packen
        shell: bash
        run: |
          V="1.0.${{ github.run_number }}"
          cd app && 7z a -tzip "../dist/Muskelklicker-Web-$V.zip" . > /dev/null

      - name: Release mit allen Dateien veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="1.0.${{ github.run_number }}"
          ls dist
          gh release create "v$V" dist/*.exe dist/*.blockmap dist/latest.yml dist/*.zip --title "$V" --notes "Muskelklicker $V – Windows: Setup-.exe · Netlify: Muskelklicker-Web-$V.zip" --target "${{ github.sha }}"
